<html lang="en">
   <head>
      <!-- Required meta tags -->
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <!-- Bootstrap CSS -->
      <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
      <link href="style.css" rel="stylesheet">
      <title>Whatsapp</title>
      <body>
         <div class="top">
             <div class="container">
               <div class="row">
                     <div class="col-md-12"></div>
               </div>
         </div>
   </div>
         <div class="content">
               <div class="container">
                     <div class="row">
                           <div class="col-sm-7">
                                 <div class="text">
                                       <h3>To use Whatsapp on your computer:</h3>
                                      <div class="step">
                                          <p>1. Open Whatsapp on your phone</p>
                                          <p>2. Tap <b>Menu</b> <i class="fa fa-ellipsis-v" aria-hidden="true"></i> or <b>Settings</b> <i class="fa fa-cog" aria-hidden="true"></i> and select <b>Whatsapp Web</b></p>
                                          <p>3. Point your phone to this screen to capture the code</p>
                                    </div>
                                    <div class="link">
                                          <a href="#">Need help to get started?</a>
                                    </div>
                                 </div>
                           </div>
                                 <div class="col-sm-5">
                                       <div class="QR">
                                             <img src="images/wt.png">
                                      
                                       <p><input type="checkbox"> Keep me signed in</p>
                                 </div>
                           </div>
                     </div>
               </div>
         </div>
            <!-- Optional JavaScript -->
      <!-- jQuery first, then Popper.js, then Bootstrap JS -->

      <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
